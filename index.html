<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Punto de Venta</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; }
        header { background-color: #00a1a7; color: white; padding: 15px; }
        .container { display: flex; height: calc(100vh - 70px); }
        .products {
            flex: 3; padding: 20px; display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px; background-color: #f5f5f5; overflow-y: auto;
        }
        .products > div {
            background: white; border: 1px solid #e0e0e0;
            border-radius: 8px; padding: 15px;
            text-align: center; transition: 0.2s ease;
        }
        .products > div:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        img { width: 120px; height: 120px; object-fit: cover; }
        .cart {
            flex: 1; padding: 20px; background-color: #fff;
            border-left: 2px solid #ddd; overflow-y: auto;
        }
        .cart-total { margin-top: 20px; font-size: 18px; font-weight: bold; }
        .btn {
            background-color: #009688; color: white;
            border: none; padding: 10px; cursor: pointer;
            width: 100%; margin-top: 10px; border-radius: 6px;
        }
        .modal {
            display: none; position: fixed; z-index: 1;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: #fff; margin: 10% auto;
            padding: 20px; border-radius: 8px;
            width: 400px;
        }
        .close { float: right; font-size: 22px; cursor: pointer; }
        footer {
            display: flex; justify-content: center;
            align-items: center; padding: 10px;
            background-color: #00a1a7; color: white;
        }
    </style>
</head>
<body>

<header>
    <h1>Facturar - Productos</h1>
</header>

<div class="container">
    <div class="products">
        <div>
            <p>Americano - $2000</p>
            <button class="btn" onclick="addToCart('Americano', 2000, 5)">Agregar producto</button>
        </div>
    </div>

    <div class="cart">
        <h2>Ticket de venta</h2>
        <div id="cart-items"></div>
        <div class="cart-total">
            Total: $<span id="cart-total">0</span>
        </div>
        <button class="btn" id="paymentBtn">Método de pago</button>
    </div>
</div>

<footer>
    <h3>Ing. Jose Chacon</h3>
</footer>

<!-- Modal Pago -->
<div id="paymentModal" class="modal">
    <div class="modal-content">
        <span class="close" id="closeModal">&times;</span>
        <h2>Selecciona el método</h2>
        <button class="btn" onclick="selectPaymentMethod('Efectivo')">Efectivo</button>
    </div>
</div>

<!-- Modal Dinámico -->
<div id="dynamicMessageModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeMessageModal()">&times;</span>
        <p id="dynamicMessageText"></p>

        <button id="changePaymentMethodBtn"
            class="btn"
            style="display:none;"
            onclick="changePaymentMethod()">
            Cambiar Método de Pago
        </button>

        <!-- FRAME AGREGADO -->
        <iframe
            id="cashdroFrame"
            style="width:100%; height:400px; margin-top:10px; display:none; border:1px solid #ccc;">
        </iframe>

    </div>
</div>

<script>
let cart = {};
let total = 0;
let operationId = null;

function addToCart(product, price, stock) {
    if (cart[product]) {
        cart[product].quantity++;
        cart[product].totalPrice += price;
    } else {
        cart[product] = { quantity: 1, totalPrice: price };
    }
    total += price;
    updateCart();
}

function updateCart() {
    const cartItems = document.getElementById('cart-items');
    cartItems.innerHTML = '';
    for (let product in cart) {
        const item = cart[product];
        cartItems.innerHTML += `${product} x ${item.quantity} - $${item.totalPrice}<br>`;
    }
    document.getElementById('cart-total').innerText = total;
}

document.getElementById('paymentBtn').onclick = () => {
    document.getElementById('paymentModal').style.display = 'block';
};

document.getElementById('closeModal').onclick = () => {
    document.getElementById('paymentModal').style.display = 'none';
};

function showMessageModal(message) {
    document.getElementById('dynamicMessageText').textContent = message;
    document.getElementById('dynamicMessageModal').style.display = 'block';
}

function closeMessageModal() {
    document.getElementById('dynamicMessageModal').style.display = 'none';
}

function selectPaymentMethod(method) {
    document.getElementById('paymentModal').style.display = 'none';

    if (method === 'Efectivo') {

        showMessageModal('Abriendo máquina para pago en efectivo...');

        let amount = total * 100;

        const startOperationUrl =
        `https://192.168.2.118/Cashdro3WS/index3.php?operation=startOperation&name=admin&password=1&type=4&posid=terminal2&parameters={"amount":"${amount}"}&startnow=true&posuser=Jose`;

        fetch(startOperationUrl)
        .then(response => response.json())
        .then(data => {
            operationId = data.response.operation.operationId;

            // MOSTRAR FRAME
            const frame = document.getElementById('cashdroFrame');
            frame.src = `http://192.168.2.118/Cashdro3Web/#/progresssale/true/${operationId}`;
            frame.style.display = 'block';

            monitorTransactionStatus();
        });

    }
}

function monitorTransactionStatus() {

    const checkStatusUrl =
    `https://192.168.2.118/Cashdro3WS/index3.php?operation=askOperation&name=admin&password=1&operationId=${operationId}`;

    function checkState() {

        fetch(checkStatusUrl)
        .then(response => response.json())
        .then(data => {

            const state = data.response.operation.state;

            if (state === "E") {
                setTimeout(checkState, 2000);
            }

            if (state === "F") {

                // OCULTAR FRAME AUTOMÁTICAMENTE
                const frame = document.getElementById('cashdroFrame');
                frame.style.display = 'none';
                frame.src = '';

                resetCart();
            }
        });
    }

    checkState();
}

function changePaymentMethod() {

    const finishOperationUrl =
    `https://192.168.2.118/Cashdro3WS/index3.php?operation=finishOperation&name=admin&password=1&type=2&operationId=${operationId}`;

    fetch(finishOperationUrl)
    .then(response => response.json())
    .then(data => {

        alert('Transacción cancelada');

        // OCULTAR FRAME AL CAMBIAR MÉTODO
        const frame = document.getElementById('cashdroFrame');
        frame.style.display = 'none';
        frame.src = '';

    });
}

function resetCart() {
    cart = {};
    total = 0;
    updateCart();
    closeMessageModal();
}

</script>

</body>
</html>
